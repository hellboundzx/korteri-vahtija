name: Korteri vahtija

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vahtija
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Kontrolli kuulutusi
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KV_URL: ${{ secrets.KV_URL }}
          CITY24_URL: ${{ secrets.CITY24_URL }}
        run: python korteri_vahtija.py

      - name: Salvesta nähtud kuulutused
        run: |
          git config user.name "korteri-vahtija"
          git config user.email "actions@users.noreply.github.com"
          git add nahtud.json
          git diff --cached --quiet || (git commit -m "uuenda nahtud.json" && git push)
